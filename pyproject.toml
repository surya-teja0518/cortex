[project]
name = "cortex"
version = "0.1.0"
description = "Multi-agent job-search system with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "sqlalchemy>=2.0", "python-dotenv>=1.0", "pyyaml>=6.0",
                "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0", "httpx>=0.27",
                "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=4.0"]
ui = ["streamlit>=1.40"]
workday = ["playwright>=1.48"]

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
