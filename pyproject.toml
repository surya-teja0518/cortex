[project]
name = "cortex"
version = "0.1.0"
description = "Multi-agent job-search system with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "sqlalchemy>=2.0", "python-dotenv>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
