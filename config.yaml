# Deterministic gates (run BEFORE any LLM call; ported from SYNAPSE)
gates:
  title_blocklist: [lead, principal, staff, architect, manager, director, "head of", vp, svp, chief]
  max_min_yoe: 5          # reject if stated min YOE > this; unstated -> VERIFY, never auto-rejected

# Deterministic scoring (ported from SYNAPSE standing rules). Applicant count is optional input.
scoring:
  base: {data: 64, database: 61, ai: 62}
  stack: {azure: 7, snowflake_databricks: 4, dba: 5, ai_ml: 3, aws_gcp_native: -6, verify: -2}
  hyderabad: 3
  applicants: {low_below: 30, low_bonus: 2, high_above: 200, high_penalty: -2}
  exp_stated: 2
  exp_unstated: -3
  min_yoe: {le3: 2, eq4: 1, eq5: -1}
  bands: {P0: 85, P1: 78, P2: 70}

rate_limits:   # requests per minute (LLM limits live per provider under llm.providers.*.rpm)
  apify: 10
  ats: 30        # public ATS board APIs: one request per board

# Public ATS boards (company career pages' own JSON APIs; no login, no key). `cortex fetch --dry-run` first.
# board = the slug in the company's careers URL:
#   job-boards.greenhouse.io/<board>   jobs.lever.co/<board>   jobs.ashbyhq.com/<board>
# Slugs below are NOT verified: a wrong one just reports "HTTP 404 (board slug not found?)".
sources:
  ats:
    boards: []
    # - {ats: greenhouse, board: databricks, company: Databricks}
    # - {ats: lever, board: <slug>, company: <Name>}
    # - {ats: ashby, board: <slug>, company: <Name>}
    filters:   # word-boundary, case-insensitive; a posting must match a title_include AND a location
               # (also used by sources.apify unless it sets its own filters)
      title_include: [data, database, dba, sql, etl, analytics engineer, ml, machine learning, ai, mlops, platform engineer,
                      snowflake, databricks, spark, pyspark, oracle, postgres, postgresql, bigquery, redshift, kafka, airflow, synapse]
      title_exclude: [lead, principal, staff, architect, manager, director, head, vp, intern, sales, marketing, scientist]
      locations: [india, hyderabad, bengaluru, bangalore, pune, chennai, mumbai, gurgaon, gurugram, noida, delhi]
  # SYNAPSE's own Apify runs: `cortex pull` reads their datasets (READ ONLY; never starts a run).
  # Needs APIFY_TOKEN in .env. Jobs already imported from the sheet merge (same source + job id).
  apify:
    since_days: 8        # runs started in the last N days (SYNAPSE runs Tue + Fri)
    max_runs: 10         # per actor
    max_items: 1000      # per dataset
    actors:
      - {actor: valig~linkedin-jobs-scraper, source: linkedin}
      - {actor: memo23~naukri-scraper, source: naukri}

# LLM providers and per-agent routes. Keys come from .env (GROQ_API_KEY, GEMINI_API_KEY); never put them here.
# Model ids change: run `cortex llm-check` after editing. Ids below were picked from each account's own
# model list on 2026-11-02. Pin exact versions (not *-latest aliases) so eval results stay reproducible.
# `extra` is merged into the request body as-is (provider-specific knobs).
llm:
  providers:
    groq:      {model: openai/gpt-oss-120b, rpm: 25, extra: {reasoning_effort: low}}
    groq_qwen: {kind: groq, model: qwen/qwen3.8-27b, rpm: 25}
    gemini:    {model: gemini-3.8-flash, rpm: 10}
    ollama_8b:     {kind: ollama, model: "qwen3:8b",      num_ctx: 12288, think: false}
    ollama_granite: {kind: ollama, model: "granite4.2:8b", num_ctx: 12288, think: false}
    ollama_small:  {kind: ollama, model: "qwen3:4b",      num_ctx: 4096,  think: false}
  routes:
    scorer: [groq, gemini, ollama_small]   # public job text: cloud first, local fallback
    tailor: [ollama_8b]                    # Surya's resume: local only
  personal_data_routes: [tailor]           # enforced in code: these routes refuse non-local providers
  # Fields left out of the scorer prompt. stack_fit is SYNAPSE's own fit verdict; the 2026-11-02 ablation
  # showed the LLM ranks no worse without it (62.4 vs 60.8 mean pct rank), so CORTEX doesn't depend on it.
  scorer_exclude_fields: [stack_fit]
  # Scorer prompt gets a SKILLS-ONLY profile built from master_resume.yaml: years (as your resume states them),
  # target roles, skill names. Never employers, metrics, bullets or contact details (Surya's decision 2026-11-13).
  # false = the old generic "data engineer / Oracle DBA, ~4 years" line. Changing it re-scores (new prompt hash).
  scorer_profile: true

# Tailoring. original (default): copy your own resume PDF for the job's domain into the packet; nothing generated.
# track: render the curated track from master_resume.yaml with relevant bullets first. llm: the Ollama rewrite tailor.
tailor:
  mode: original             # original: your own PDF from originals_dir, picked by classifying the job (DBA/DE/AI)
  originals_dir: resumes     # gitignored folder with your 3 resume PDFs
  originals: {}              # track -> your file name; default <track>.pdf. Set yours in config.local.yaml
  track_map: {data: data_engineer, database: oracle_dba, ai: ai_ml}
  default_track: data_engineer
  cover_note: false          # llm mode only; Surya doesn't send cover letters

tracker:
  followup_days: 7           # flag applied/interview jobs with no update for this many days
  stale_days: 30             # ...up to this many; older ones: `cortex close-stale` -> no_response

# Dashboard hides to_apply postings older than this (posted date, else date added): most close within weeks and
# LinkedIn can't be checked automatically. View-only, nothing is marked closed; a sidebar box shows them again.
# ATS jobs are closed EXACTLY: gone from the company's board on `cortex fetch` -> status closed.
freshness:
  max_age_days: 30
# `cortex check-open`: is a LinkedIn job still open? Reads LinkedIn's PUBLIC no-login job page from your Mac.
# A deliberate exception to "no LinkedIn scraping" (Surya, 2026-11-13; AGENTS.md). Off by default: turn it on in
# config.local.yaml (gitignored), not here. Risk: LinkedIn
# may throttle or CAPTCHA your home IP; the run stops at the first push-back. Never part of `cortex daily`.
linkedin_check:
  enabled: false
  max_per_run: 20        # jobs per run (hard cap). First real run: LinkedIn sent 429 after 23 requests at ~6 s
  delay_seconds: 10      # between requests, plus random jitter; never below 3
  recheck_days: 3        # a job checked open isn't re-checked for this long, so runs rotate through the queue
  max_age_days: 30       # only check postings newer than this; older ones are hidden in the queue anyway

# Two-way Google Sheet sync (`cortex sync`; first step of `cortex daily` when enabled). Set enabled +
# spreadsheet_id (from the sheet URL /d/<id>/edit) in config.local.yaml. key_file = the service account's JSON
# key (a secret: gitignored). Writes ONLY the Status column, only when CORTEX knows a later status.
sheets:
  enabled: false
  spreadsheet_id: ""
  tab: Untitled
  key_file: google-service-account.json
  write_back: true

# `cortex daily` (pull -> fetch -> score -> digest), run by launchd: `cortex schedule --install`.
daily:
  hour: 9            # local time on the Mac; launchd runs a missed time when the Mac wakes
  minute: 7
  score_limit: 100   # LLM calls per run (Groq free tier: ~500 scoring calls/day)

# Email digest to your own GMAIL_ADDRESS (.env). Counts + company/title only; no links; never resume content.
digest:
  top_n: 15
  send_when_empty: false
