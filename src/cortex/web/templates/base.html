<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>CORTEX</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="top">
    <a class="brand" href="/">CORTEX</a>
    <nav>
      <a href="/" {% if nav == 'queue.html' %}aria-current="page"{% endif %}>Queue</a>
      <a href="/approvals" {% if nav == 'approvals.html' %}aria-current="page"{% endif %}>Approvals</a>
      <a href="/applications" {% if nav == 'applications.html' %}aria-current="page"{% endif %}>Applications</a>
      <a href="/report" {% if nav == 'report.html' %}aria-current="page"{% endif %}>Report</a>
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </header>
  <main>
    <div id="flash" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
